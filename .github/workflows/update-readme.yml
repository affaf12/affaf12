name: Update Latest Repositories

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest repos and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { data: repos } = await github.rest.repos.listForUser({
              username: 'affaf12',
              sort: 'updated',
              per_page: 10
            });

            const list = repos
              .filter(r => !r.fork && r.name !== 'affaf12')
              .slice(0, 5)
              .map(r => `- [**${r.name}**](${r.html_url}) — ${r.description || 'No description yet'}`)
              .join('\n');

            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- REPOS-START -->[\s\S]*<!-- REPOS-END -->/,
              `<!-- REPOS-START -->\n${list}\n<!-- REPOS-END -->`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update latest repositories"
          git push
